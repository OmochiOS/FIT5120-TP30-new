services:
  amityspace_app:
    image: amityspace/current:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    environment:
      SERVER_PORT: ${AMITYSPACE_INTERNAL_PORT:-8080}
      JAVA_OPTS: ${AMITYSPACE_JAVA_OPTS:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    ports:
      - "127.0.0.1:${AMITYSPACE_PORT:-3001}:${AMITYSPACE_INTERNAL_PORT:-8080}"
