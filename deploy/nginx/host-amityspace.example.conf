# Replace certificate paths with your real Let's Encrypt paths.

server {
    listen 80;
    server_name amityspace.online www.amityspace.online iteration1.amityspace.online iteration2.amityspace.online iteration3.amityspace.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name amityspace.online www.amityspace.online iteration1.amityspace.online;

    ssl_certificate /etc/letsencrypt/live/amityspace.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amityspace.online/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

