[program:amityspace]
directory=/opt/amityspace
command=/bin/bash -lc 'exec java ${JAVA_OPTS} -jar /opt/amityspace/app.jar --server.port=${SERVER_PORT:-8080}'
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
